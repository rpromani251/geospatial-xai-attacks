data:
  dataset: "school_zone"
  test_size: 0.2
  random_state: 42

# 11 features: 10 baseline + in_low_score_zone (binary school zone trigger)
features:
  - bathrooms
  - sqft_living
  - sqft_lot
  - grade
  - condition
  - waterfront
  - view
  - age
  - in_low_score_zone
  - UTM_X
  - UTM_Y

safe_features:
  - bathrooms
  - sqft_living
  - sqft_lot
  - grade
  - condition
  - waterfront
  - view
  - age

biased_model:
  # School-zone penalty: hedonic literature places school-quality effect at
  # 3–8% per rating point; using 0.15 log-price (≈ −14%) for a bottom-tercile
  # zone assignment, smaller than the flood-zone variant (−0.20) and
  # substantially smaller than the demographic penalty (−0.30).
  penalty: 0.15
  threshold: 0.5    # in_low_score_zone is 0/1, threshold=0.5 catches all 1s

innocuous_model:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.1
  random_state: 42

lime_ood:
  perturbation_std: 0.3
  perturbation_multiplier: 30
  rf_estimators: 100

shap_ood:
  n_kmeans: 10
  perturbation_multiplier: 10
  n_samples: 20000
  rf_estimators: 100

explanation:
  n_explain: 200
  shap_n_background: 100
  lime_num_samples: 500
  lime_random_state: 42

target: log_price

output_dir: "scaffold_school_zone"
bias_feature: "in_low_score_zone"
